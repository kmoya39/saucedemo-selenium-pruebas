# Ejecuta la suite de pruebas en GitHub Actions cada vez que se sube código
# y permite ejecutarla a mano desde la pestaña Actions (workflow_dispatch).
name: Pruebas Selenium SauceDemo

on:
  push:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ejecutar pruebas (Chrome sin interfaz)
        env:
          HEADLESS: "1"
        run: pytest
      - name: Guardar reportes y capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: reportes/
